# The `perf` check (perf/README.md, "Where it runs"), a required status check: a pull request from
# this repo that touches a web view path perf/README.md lists needs a `## Perf` section in its body
# with the table `make perf` printed on a Mac, no FAIL row, and a `commit:` line naming a commit of
# the pull request. A fork's pull request is exempt (the maintainer runs `make perf` before
# deploying it). Read-only token; editing the body runs it again. GitHub-hosted runner.
name: perf

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: perf-table-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  perf:
    name: perf
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await require('./.github/scripts/perf-table.cjs').check({ github, context, core });
