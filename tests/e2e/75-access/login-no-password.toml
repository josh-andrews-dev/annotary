# spec: S06-12
# The main server's owner has no local password: `login` refuses (exit 5) with a hint, before
# any password prompt. The server prompt (stderr) is answered from stdin (blank = the profile's).
bin.name = "annotary"
args = ["-p", "rowan", "login"]
stdin = "\n"
status.code = 5
stdout = ""
stderr = """
server [[URL]]: [URL]
error: no local password is set on [URL] — the owner sets one at [URL]/settings (in a browser on the server's machine, where it trusts you as the owner); until then use a token: ANNOTARY_TOKEN=… (printed by first-run setup) or `annotary member add HANDLE` for another Member
"""
