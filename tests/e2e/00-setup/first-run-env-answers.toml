# spec: S01-10
# Every prompt can be answered from the environment (ANNOTARY_SETUP_HANDLE/NAME/PASSWORD),
# no stdin needed; the password is never echoed.
bin.name = "annotary"
args = ["serve", "--setup-only"]
env.add = { ANNOTARY_HOME = "cdhome", USER = "rowan", ANNOTARY_SETUP_HANDLE = "ana", ANNOTARY_SETUP_NAME = "Ana Lima", ANNOTARY_SETUP_PASSWORD = "hunter2" }
fs.sandbox = true
status = "success"
stdout = """
Tenant created at [..]/cdhome/store
  owner handle [rowan]: ana
  display name [[..]]: Ana Lima
  local password (blank = loopback trust, browser is you): ********
Vault "notes" created.
Owner token for the CLI (shown once) — put it in your shell or a profile in [..]/cdhome/config.toml:

  ANNOTARY_TOKEN=ant_[..]

No CLI credential is saved: export the token above, or run `annotary login` (needs the local password); `annotary member add <handle>` adds a Member and mints their token.
"""
stderr = ""
