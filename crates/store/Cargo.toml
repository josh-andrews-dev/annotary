[package]
name = "annotary-store"
description = "SQLite store: schema + forward-only migrations, members/memberships/tokens/vaults/settings/sessions, append-only events with a Tenant-wide seq, store LOCK and meta.json."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# Enables `fail` crate failpoints inside mutation paths (tests only; the `annotary` crate turns
# this on through its dev-dependencies, so release builds never carry it).
failpoints = ["fail/failpoints"]
# Counts the SQL statements the store's connection runs ([`stmt_count`]), for the size report
# (`crates/annotary/tests/size_report.rs`); tests only, turned on the same way as `failpoints`.
stmt-count = ["rusqlite/trace"]

[dependencies]
annotary-sidecar = { workspace = true }
# ticket 07: the server places Threads a client left out and spot-verifies what it was sent
# with the same pure function the CLI runs.
annotary-diff = { workspace = true }
# ticket 13: `backup` = the SQLite online backup API behind `annotary export` (a consistent
# snapshot of a live store).
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
jiff = { workspace = true }
sha2 = "0.10"
getrandom = "0.3"
argon2 = "0.5"
ulid = "1"
fail = "0.5"
libc = "0.2"
# ---- ticket 13: `export` = a tar of `store/` (snapshot DB + blobs); the snapshot is a temp file ----
tar = "0.4"
tempfile = { workspace = true }
# ---- end ticket 13 ----
# Member avatars: the SVG check reads the XML as events (no DTD, no entity expansion), and a
# raster avatar must have dimensions its header gives.
quick-xml = "0.42"
imagesize = "0.15"

[dev-dependencies]
tempfile = { workspace = true }
