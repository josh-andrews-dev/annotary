[package]
name = "annotary-diff"
description = "Histogram line diff + word/character diff + Thread re-anchoring: the pure function of (text N, text N+1, anchors) the CLI, the server (spot-verification) and the WASM build share (ticket 07). Builds for wasm32-unknown-unknown."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# Source coordinates (`Range`, `lines`, `extract`) are one definition, in the sidecar crate.
annotary-sidecar = { workspace = true }
# Histogram line diff (git's), also the bounded Myers fallback for oversized hunks.
imara-diff = { version = "0.2", default-features = false }
# Myers diff of the tokens inside changed lines.
similar = { version = "3", default-features = false, features = ["std"] }
# UAX #29 word boundaries: the tokens inside changed lines (words, spaces, punctuation, CJK
# ideographs one each), so a change is judged by the words that survive it.
unicode-segmentation = "1"

[dev-dependencies]
# Real renderer output for the rendered-diff tests (`tests/rendered_diff.rs`).
annotary-renderer = { workspace = true }
proptest = "1"
serde = { workspace = true }
serde_json = { workspace = true }
